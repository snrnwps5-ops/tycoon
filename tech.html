/* ---------- movement ---------- */
function collideBox(px, pz, R){
  for(const b of OB){
    if(b.off) continue;
    if(px>b.x1-R&&px<b.x2+R&&pz>b.z1-R&&pz<b.z2+R) return b;
  }
  return null;
}
function collideAxis(p, axis, oldVal){
  const R=0.28;
  const b=collideBox(p.x, p.z, R);
  if(b){
    if(axis==='x'){
      if(p.x>oldVal) p.x=b.x1-R; else p.x=b.x2+R;
    } else {
      if(p.z>oldVal) p.z=b.z1-R; else p.z=b.z2+R;
    }
  }
  p.x=Math.max(-6.6,Math.min(6.6,p.x));
  p.z=Math.max(-7.8,Math.min(5.6,p.z));
}
function collide(p){
  const R=0.28;
  for(const b of OB){
    if(b.off) continue;
    if(p.x>b.x1-R&&p.x<b.x2+R&&p.z>b.z1-R&&p.z<b.z2+R){
      const dl=p.x-(b.x1-R), dr=(b.x2+R)-p.x, dt=p.z-(b.z1-R), db=(b.z2+R)-p.z, m=Math.min(dl,dr,dt,db);
      if(m===dl) p.x=b.x1-R; else if(m===dr) p.x=b.x2+R; else if(m===dt) p.z=b.z1-R; else p.z=b.z2+R;
    }
  }
  p.x=Math.max(-6.6,Math.min(6.6,p.x));
  p.z=Math.max(-7.8,Math.min(5.6,p.z));
}
function walkTo(o,dt,spd){ if(!o.wp||!o.wp.length) return true; const t=o.wp[0]; const dx=t.x-o.pos.x, dz=t.z-o.pos.z, L=Math.hypot(dx,dz); if(L<0.08){ o.wp.shift(); return !o.wp.length; } const s=Math.min(spd,L/dt); o.pos.x+=dx/L*s*dt; o.pos.z+=dz/L*s*dt; o.face=Math.atan2(dx,dz); o.speed=s; return false; }
function angLerp(a,b,t){ let d=b-a; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; return a+d*t; }
