<style>
:root{--d:'Black Han Sans','Noto Sans KR',-apple-system,sans-serif;--b:'Noto Sans KR',-apple-system,"Apple SD Gothic Neo",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0a2466;touch-action:none;font-family:var(--b)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
.star{position:relative;width:46px;height:46px;flex:none}
.star svg{width:46px;height:46px;filter:drop-shadow(0 2px 0 #b86a00)}
.star b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:4px;font-family:var(--d);font-size:17px;color:#7a3a00}
.star i{position:absolute;left:4px;right:4px;bottom:-6px;height:5px;border-radius:3px;background:rgba(0,0,0,.25);overflow:hidden}.star i s{display:block;height:100%;background:#7bea62;width:0}
.pill{flex:1;display:flex;align-items:center;height:38px;border-radius:19px;background:linear-gradient(#5aa8ff,#2f6fd8);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 3px 0 #1c3f9a;position:relative;padding-left:42px}
.pill .ic{position:absolute;left:-6px;top:-6px;width:48px;height:48px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.pill b{flex:1;text-align:center;font-family:var(--d);font-size:21px;color:#fff;text-shadow:0 2px 0 #1c3f9a}
.pill.bump{animation:bump .25s}@keyframes bump{50%{transform:scale(1.08)}}
.mbtn{width:44px;height:44px;border:0;border-radius:12px;background:linear-gradient(#ffcf4d,#ff8a1a);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 3px 0 #b85a00;color:#fff;font-family:var(--d);font-size:13px;line-height:1;padding:0}
#sub{position:fixed;left:12px;top:calc(64px + env(safe-area-inset-top));z-index:5;display:flex;gap:6px}
.chip2{padding:4px 9px 5px;border-radius:11px;background:rgba(20,30,60,.55);color:#fff;font:900 12px var(--b);white-space:nowrap}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font:900 13px var(--b);color:#2a2a3a;background:#fff;border-radius:12px;padding:4px 9px 5px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.lb:after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.lb.need{background:#ff5a4a;color:#fff}.lb.need:after{border-top-color:#ff5a4a}
.lb.tier0{background:#8a7a6a;color:#fff}.lb.tier0:after{border-top-color:#8a7a6a}
.lb.tier2{background:#2f3442;color:#fff}.lb.tier2:after{border-top-color:#2f3442}
.lb.tier3{background:linear-gradient(#ffd23f,#ff9a1a);color:#5a2a00}.lb.tier3:after{border-top-color:#ff9a1a}
.lb .pt{display:block;height:4px;margin-top:3px;border-radius:2px;background:rgba(0,0,0,.15);overflow:hidden}.lb .pt s{display:block;height:100%;background:#46c95a}
.ft{position:absolute;transform:translate(-50%,-50%);font-family:var(--d);font-size:22px;color:#fff;-webkit-text-stroke:1.5px #1d6a1d;paint-order:stroke fill;text-shadow:0 2px 0 #1d6a1d;white-space:nowrap}
.ft.say{font:900 13px var(--b);color:#3a2a20;-webkit-text-stroke:0;text-shadow:none;background:#fff;padding:4px 9px;border-radius:12px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.ft.bad{-webkit-text-stroke-color:#7a1010;text-shadow:0 2px 0 #7a1010;color:#ff8a80}
#joy{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);z-index:6;display:none;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#dde3ee);box-shadow:0 4px 0 rgba(0,0,0,.2)}
#toast{position:fixed;left:50%;top:calc(130px + env(safe-area-inset-top));transform:translate(-50%,-50%) scale(.7);padding:9px 18px 11px;border-radius:16px;font-family:var(--d);font-size:15px;color:#fff;text-align:center;white-space:pre-line;background:linear-gradient(#8a63ff,#5a34d6);box-shadow:0 4px 0 #3a1f99;opacity:0;pointer-events:none;z-index:8;transition:opacity .25s,transform .3s cubic-bezier(.2,1.6,.4,1)}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#evt{position:fixed;left:50%;top:calc(104px + env(safe-area-inset-top));transform:translateX(-50%) scale(.6);opacity:0;z-index:7;display:flex;align-items:center;gap:8px;padding:7px 12px 9px 14px;border-radius:15px;background:linear-gradient(#ff5a3a,#e8243a);border:3px solid #ffd23f;box-shadow:0 4px 0 #8a0f1f;transition:all .3s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
#evt.on{opacity:1;transform:translateX(-50%) scale(1)}#evt b{font-family:var(--d);font-size:20px;color:#fff;white-space:nowrap}#evt span{font:900 11px var(--b);color:#ffe9a0;white-space:nowrap}#evt em{font-style:normal;font-family:var(--d);font-size:22px;color:#3a1a00;background:#ffd23f;border-radius:10px;padding:1px 8px}
#bbar{position:fixed;left:12px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:8px}
.bb{position:relative;width:70px;height:68px;border:0;border-radius:18px;color:#fff;font-family:var(--d);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.msrow{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border-radius:14px;padding:9px 10px;margin:7px 0;box-shadow:0 2px 0 #e6d2b0}.msrow .tx{flex:1}.msrow b{display:block;font-family:var(--d);font-size:15px;color:#4a2a10}.msrow .bar{height:8px;border-radius:4px;background:#eadcc4;margin-top:5px;overflow:hidden}.msrow .bar s{display:block;height:100%;background:linear-gradient(90deg,#7bea62,#2faa45)}.msrow small{font:700 11px var(--b);color:#8a6a4a}.msrow button{width:auto!important;margin:0!important;padding:8px 10px!important;font-size:14px!important;min-width:70px}.msrow button:disabled{filter:grayscale(1);opacity:.55}
.stc{display:flex;gap:10px;align-items:center;text-align:left;border-radius:16px;padding:10px;margin:8px 0;background:#fff;box-shadow:0 3px 0 #e6d2b0}.stc .ic{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--d);color:#fff;font-size:22px;flex:none}.stc b{display:block;font-family:var(--d);font-size:17px;color:#4a2a10}.stc small{font:700 12px var(--b);color:#8a6a4a}.stc button{width:auto!important;margin:0!important;padding:8px 12px!important;font-size:15px!important}.stc.lock{opacity:.55}
.bb.g{background:linear-gradient(#7bea62,#2faa45);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 #1d7a2a}.bb.o{background:linear-gradient(#ffcf4d,#ff8a1a);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 #b85a00}.bb.b{background:linear-gradient(#5aa8ff,#2f6fd8);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 #1c3f9a}
.bb i{position:absolute;right:-4px;top:-4px;width:16px;height:16px;border-radius:50%;background:#e8342a;border:2px solid #fff;display:none}
#upBtn{color:#fff;font-family:var(--d);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}

.uprow{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border-radius:14px;padding:9px 10px;margin:7px 0;box-shadow:0 2px 0 #e6d2b0}
.uprow .ui{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--d);font-size:18px;color:#fff;flex:none}
.uprow .tx{flex:1}.uprow b{display:block;font-family:var(--d);font-size:16px;color:#4a2a10}.uprow small{font:700 12px var(--b);color:#8a6a4a}
.uprow button{width:auto!important;margin:0!important;padding:8px 10px!important;font-size:15px!important;min-width:74px}
.uprow button:disabled{filter:grayscale(1);opacity:.6}
#big{position:fixed;left:0;right:0;top:32%;text-align:center;z-index:9;pointer-events:none;opacity:0;transform:scale(.4);transition:opacity .25s,transform .45s cubic-bezier(.2,1.8,.4,1)}
#big.on{opacity:1;transform:scale(1)}
#big b{display:block;font-family:var(--d);font-size:48px;color:#ffe14d;-webkit-text-stroke:3px #7a2a00;paint-order:stroke fill;text-shadow:0 5px 0 #7a2a00,0 10px 18px rgba(0,0,0,.3)}
#big span{display:inline-block;margin-top:8px;padding:5px 14px;border-radius:12px;background:#e8342a;color:#fff;font:900 14px var(--b);box-shadow:0 3px 0 #8a0f1f}
#help{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) scale(.6);opacity:0;pointer-events:none;z-index:7;border:0;border-radius:16px;padding:9px 16px 10px;background:linear-gradient(#ffcf4d,#ff8a1a);box-shadow:0 5px 0 #b85a00,0 0 0 4px #fff;transition:all .3s cubic-bezier(.3,1.6,.5,1)}
#help.on{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1);animation:hp 1s ease-in-out infinite}@keyframes hp{50%{transform:translateX(-50%) scale(1.06)}}
#help b{display:block;font-family:var(--d);font-size:17px;color:#fff;text-shadow:0 2px 0 #b85a00;white-space:nowrap}#help span{font:900 11px var(--b);color:#7a3a00}
#hint{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 16px;border-radius:18px;background:rgba(20,30,60,.6);color:#fff;font:900 14px var(--b);white-space:nowrap;z-index:5;pointer-events:none;transition:opacity .3s}
#load{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#5ec8ff,#ffe7a8);transition:opacity .4s}
#load .t{font-family:var(--d);font-size:46px;color:#ffe14d;-webkit-text-stroke:3px #7a2a00;paint-order:stroke fill;text-shadow:0 5px 0 #7a2a00}
#load .s{margin-top:14px;font:900 14px var(--b);color:#7a4a20}
#load.done{opacity:0;pointer-events:none}
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,20,40,.55)}
#modal.on{display:flex}
#modal .box{width:min(320px,86vw);border-radius:22px;background:#fff8ea;box-shadow:0 6px 0 #c9a46a;padding:18px 16px 16px;text-align:center}
#modal h2{margin:0 0 8px;font-family:var(--d);font-size:24px;color:#5a2a00}
#modal p{margin:0 0 14px;font:700 14px/1.5 var(--b);color:#6a4a30}
#modal button{border:0;border-radius:14px;padding:11px 0;width:100%;margin-top:8px;font-family:var(--d);font-size:18px;color:#fff;background:linear-gradient(#7bea62,#2faa45);box-shadow:0 4px 0 #1d7a2a}
#modal button.gray{background:linear-gradient(#b8c2d0,#8a96a8);box-shadow:0 4px 0 #5a6578}
#title{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8vh) 20px calc(env(safe-area-inset-bottom,0px) + 7vh);background:linear-gradient(180deg,rgba(4,20,70,.55) 0%,rgba(4,20,70,0) 28%,rgba(4,20,70,0) 68%,rgba(4,20,70,.6) 100%),url(hotel_keyart.jpg) center/cover no-repeat #0a3a9a;transition:opacity .6s,transform .6s}#title.out{opacity:0;transform:scale(1.08);pointer-events:none}
#title h1{margin:0;font-family:var(--d);font-weight:400;font-size:60px;line-height:1;color:#fff;text-shadow:0 4px 0 #0a4a6a,0 0 30px rgba(120,230,255,.7)}#title .ty{margin-top:10px;font:900 15px var(--b);letter-spacing:13px;padding-left:13px;color:#ffe9a8}#title .sp{flex:1}
#tStart{width:250px;height:70px;border:0;border-radius:24px;background:linear-gradient(#ffe14d,#ff9a1a);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 7px 0 #b85a00,0 16px 30px rgba(0,0,0,.3);color:#fff;font-family:var(--d);font-size:30px;text-shadow:0 2px 0 #b85a00;animation:tpu 1.5s ease-in-out infinite}@keyframes tpu{50%{transform:scale(1.045)}}
#tLobby{margin-top:16px;border:0;background:transparent;color:#eafaff;font:800 13px var(--b);text-decoration:underline}
#road{position:fixed;inset:0;z-index:39;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--rbg,#0b1c66);animation:rdin .45s ease-out}#road.out{opacity:0;transform:scale(1.06);transition:opacity .5s,transform .5s;pointer-events:none}@keyframes rdin{0%{opacity:0;transform:translateY(30px)}}
.rdTop{display:flex;align-items:center;gap:8px;margin-bottom:8px}.rdTabs{flex:1;display:flex;gap:4px;padding:4px;border-radius:16px;background:rgba(0,0,0,.28)}.rdTabs button{flex:1;border:0;border-radius:12px;padding:8px 0;font-family:var(--d);font-size:15px;color:#dfe9ff;background:transparent}.rdTabs button.on{color:#fff;background:linear-gradient(#ffcf4d,#ff8a1a);box-shadow:0 3px 0 #b85a00}
.rdStar{font:900 14px var(--b);color:#ffd23f;background:rgba(0,0,0,.28);border-radius:12px;padding:8px 10px;white-space:nowrap}
.rdFrame{flex:1;position:relative;border-radius:26px;border:4px solid #fff;overflow:hidden;background-color:var(--rpaper,#17349a);background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:80px 80px,80px 80px,20px 20px,20px 20px;box-shadow:inset 0 0 40px rgba(0,0,0,.25)}
.rdScroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}.rdIn{position:relative;margin:0 auto;width:100%;max-width:420px}
.rdIn svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.rdN{position:absolute;width:176px;transform:translate(-50%,-50%);text-align:center;cursor:pointer}.rdN .im{position:relative;width:176px;height:150px;border-radius:22px;border:4px solid #fff;background:#223 center/cover no-repeat;box-shadow:0 8px 0 rgba(0,0,0,.25),0 14px 24px rgba(0,0,0,.3);overflow:hidden}
.rdN.lock .im,.rdN.next .im{border-color:#aab3c6}.rdN.lock .im:after,.rdN.next .im:after{content:'🔒';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;background:rgba(20,26,50,.45)}
.rdN.cur .im{border-color:#ffd23f;animation:rdp 1.4s ease-in-out infinite}@keyframes rdp{50%{box-shadow:0 8px 0 rgba(0,0,0,.25),0 0 0 7px rgba(255,210,63,.45)}}.rdN.sel .im{outline:4px solid #5ad1ff;outline-offset:3px}
.rdN .bd{display:inline-block;margin-top:-13px;position:relative;z-index:1;font:900 12px var(--b);color:#5a2a00;background:linear-gradient(#ffe14d,#ffb020);border-radius:9px;padding:3px 10px;box-shadow:0 2px 0 #b87a00}.rdN.lock .bd{background:#c9d0dc;color:#4a5468;box-shadow:0 2px 0 #8a93a6}.rdN.done .bd{background:linear-gradient(#9cf27a,#2fb54a);color:#fff;box-shadow:0 2px 0 #1d7a2a}
.rdN .nm{margin:5px auto 0;display:inline-block;font-family:var(--d);font-size:16px;color:#fff;background:var(--rplate,linear-gradient(#5aa8ff,#2f6fd8));border-radius:12px;padding:6px 14px;box-shadow:0 4px 0 rgba(0,0,0,.3);white-space:nowrap}.rdN.lock .nm,.rdN.next .nm{background:linear-gradient(#8a93a6,#5a6578)}
.rdPin{position:absolute;right:-6px;bottom:28px;font-size:34px;animation:rdb 1s ease-in-out infinite;z-index:2}@keyframes rdb{50%{transform:translateY(-7px)}}
.rdInfo{margin-top:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:7px 12px;color:#fff;font:700 12px var(--b);min-height:34px}.rdInfo b{font-weight:900;color:#ffd23f}
#rdGo{margin-top:8px;height:66px;border:0;border-radius:22px;background:linear-gradient(#ffe14d,#ff9a1a);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 6px 0 #b85a00;color:#fff;font-family:var(--d);font-size:28px;text-shadow:0 2px 0 #b85a00}#rdGo:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 2px 0 #b85a00}#rdGo:disabled{filter:grayscale(1);opacity:.7}
body.title #hud,body.title #sub,body.title #bbar{opacity:0!important;pointer-events:none!important}
@media (display-mode:standalone){html{height:100vh;min-height:calc(100% + env(safe-area-inset-top))}body{height:100vh}}
</style>

<body>
<canvas id="c"></canvas><div id="vig" style="position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(20,24,40,.28) 100%)"></div>
