<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>charlab</title>
<style>html,body{margin:0;height:100%;background:#22252c;overflow:hidden}canvas{display:block}</style>
</head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="../assets.js"></script>
<script>
const AB=window.BUNSIK_ASSETS||{};
const MODELS=['Casual_Male','Casual_Female','Casual2_Male','Casual2_Female','Casual3_Male','Casual3_Female','Suit_Male','Suit_Female','OldClassy_Male','OldClassy_Female','Casual_Bald','Chef_Male','Chef_Female','Worker_Male','Worker_Female'];
const Q=new URLSearchParams(location.search); const ROW=+(Q.get('row')||0), HEAD=Q.get('head')==='1';
const scene=new THREE.Scene(); scene.background=new THREE.Color('#22252c');
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(1); renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);
const cam=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.05,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,1.05));
const dl=new THREE.DirectionalLight(0xffffff,0.85); dl.position.set(2,5,6); scene.add(dl);
function b64(s){ const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u.buffer; }
const L=new THREE.GLTFLoader();
const SKINS=['#f7d2b5','#f2c7a0','#e8b48a'];
function load(n){ return new Promise(res=>L.parse(b64(AB['q:'+n]),'',g=>res(g))); }
(async()=>{
  const names=MODELS.slice(ROW*5,ROW*5+5);
  const holders=[];
  for(let i=0;i<names.length;i++){
    const g=await load(names[i]);
    const m=THREE.SkeletonUtils.clone(g.scene);
    m.traverse(x=>{ if(x.isMesh){ const mt=x.material; let c=mt.color?mt.color.clone():new THREE.Color('#fff'); c.convertLinearToSRGB(); let hex='#'+c.getHexString();
      if(/^Skin$/.test(mt.name||'')) hex=SKINS[i%SKINS.length];
      x.material=new THREE.MeshPhongMaterial({color:hex,shininess:10,specular:0x151515,skinning:true}); } });
    const holder=new THREE.Group(); holder.add(m); scene.add(holder);
    holder.updateMatrixWorld(true);
    let box=new THREE.Box3().setFromObject(m); let sz=box.getSize(new THREE.Vector3());
    const sc=1.7/sz.y; m.scale.multiplyScalar(sc); holder.updateMatrixWorld(true);
    box=new THREE.Box3().setFromObject(m); m.position.y=-box.min.y; holder.position.x=(i-2)*0.9;
    holders.push(holder);
    const d=document.createElement('div'); d.textContent=names[i];
    d.style.cssText='position:fixed;left:'+(9+i*19)+'%;bottom:4px;color:#fff;font:12px monospace'; document.body.appendChild(d);
  }
  const ab=new THREE.Box3(); holders.forEach(h=>ab.expandByObject(h)); const c=ab.getCenter(new THREE.Vector3()); const s=ab.getSize(new THREE.Vector3());
  const dist=(Math.max(s.x,s.y*innerWidth/innerHeight)/2)/Math.tan(30*Math.PI/360)+0.6;
  if(HEAD){ cam.position.set(c.x,c.y+0.55,dist*0.35); cam.lookAt(c.x,c.y+0.55,c.z); }
  else { cam.position.set(c.x,c.y,dist); cam.lookAt(c.x,c.y,c.z); }
  function tick(){ requestAnimationFrame(tick); renderer.render(scene,cam); } tick();
  window.__ok=1;
})();
</script></body></html>
