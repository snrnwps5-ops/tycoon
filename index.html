  const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();

const MPOOL=[
  {k:'serve',g:[12,20,30],t:n=>'손님 '+n+'명 서빙하기',ic:'🙋'},{k:'fish',g:[6,12,20],t:n=>'재료 '+n+'개 낚기',ic:'🎣'},
  {k:'earn',g:[200,500,1000],t:n=>'💰'+n.toLocaleString()+' 벌기',ic:'💰'},{k:'combo',g:[3,5,7],t:n=>'콤보 ×'+n+' 달성하기',ic:'🔥'},
  {k:'vip',g:[1,2,4],t:n=>'👑 VIP 손님 '+n+'명 서빙',ic:'👑'},{k:'perfect',g:[1,3,5],t:n=>'퍼펙트 낚시 '+n+'번',ic:'✨'},
  {k:'harvest',g:[5,10,15],t:n=>'채소 '+n+'개 수확하기',ic:'🥬'},{k:'unlock',g:[1,2,3],t:n=>'시설 '+n+'개 열기',ic:'🟩'},{k:'giant',g:[1],t:()=>'거대 '+(ST.giant==='sausage'?'소시지':'어묵')+' 낚기',ic:'🐋'}];
const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
function genMissions(keepBonus){ const pool=MPOOL.filter(m=>(m.k!=='harvest'||unlocked.has('garden'))&&(m.k!=='vip'||unlocked.has('s2')||SI>0)).sort(()=>Math.random()-0.5).slice(0,3);
  S.missions=pool.map((m,i)=>{ const tier=Math.min(m.g.length-1,i); return {k:m.k,goal:Math.round(m.g[tier]*(m.k==='earn'?(SI+1):1)),prog:0,rw:5+tier*5,done:false,claimed:false}; });
  if(!keepBonus){ S.mDay=today(); S.mBonus=false; } }
function ensureMissions(){ if(!S.missions||S.mDay!==today()) genMissions(false); }
ensureMissions();
function mission(k,v,isMax){ ensureMissions(); S.missions.forEach(m=>{ if(m.k!==k||m.done) return; m.prog=isMax?Math.max(m.prog,v):m.prog+v;
  if(m.prog>=m.goal){ m.done=true; const d=MPOOL.find(x=>x.k===k); setTimeout(()=>{ toast('📋 미션 완료!\n'+d.t(m.goal)+'\n📋 버튼에서 💎'+m.rw+' 받기',3); sfx.gem(); },300); } }); }
function misHTML(){ ensureMissions(); let h='<button class="x" data-a="close">✕</button><h2>오늘의 미션</h2>';
  S.missions.forEach((m,i)=>{ const d=MPOOL.find(x=>x.k===m.k), pr=Math.min(1,m.prog/m.goal);
    h+='<div class="item"><div class="ii">'+d.ic+'</div><div class="tx"><b>'+d.t(m.goal)+'</b><div class="mbar"><i style="width:'+(pr*100)+'%"></i></div><small>'+Math.min(Math.floor(m.prog),m.goal).toLocaleString()+' / '+m.goal.toLocaleString()+'</small></div>'+
      (m.claimed?'<button class="btn g">완료 ✓</button>':m.done?'<button class="btn p" data-a="claimM" data-v="'+i+'">'+IC('gem')+m.rw+'</button>':'<button class="btn g">'+IC('gem')+m.rw+'</button>')+'</div>'; });
  const all=S.missions.every(m=>m.claimed);
  h+=all?(S.mBonus?'<div class="note" style="font-size:15px">🎉 오늘 미션 끝! 내일 새 미션이 와요</div>':'<button class="btn wide p" data-a="bonusM">🎁 올클리어 보너스 💎20 받기</button>'):'<div class="note">3개를 다 깨면 보너스 💎20</div>';
  return h+'<button class="btn wide y" data-a="refreshM">🔄 새 미션으로 바꾸기 (💎5)</button>'; }
const xpNeed=l=>10+l*10;
function addXP(n){ S.xp+=n; while(S.xp>=xpNeed(S.lv)){ S.xp-=xpNeed(S.lv); S.lv++; const r=3+S.lv; S.gems+=r; confetti(45); sfx.win();
  setTimeout(()=>toast('⬆️ 레벨 업! 사장님 Lv.'+S.lv+'\n💎 +'+r,2.8),200); } }

  [[-2.0,1.5],[2.0,-1.5]].forEach(([x,z])=>{ M(new THREE.CylinderGeometry(0.2,0.15,0.3,12),L('#e8e2d6'),x,0.17,z); M(new THREE.SphereGeometry(0.3,14,10),L('#4aae36'),x,0.5,z); M(new THREE.SphereGeometry(0.2,12,9),L('#79d45a'),x+0.1,0.68,z-0.05); });
  if(i===2){ [[-2.1,-1.6]].forEach(([x,z])=>{ M(new THREE.CylinderGeometry(0.06,0.09,1.6,8),L('#a0703e'),x,0.8,z); for(let k=0;k<6;k++){ const f=M(new THREE.SphereGeometry(1,10,6),L('#3fb36b'),x+Math.cos(k)*0.35,1.6,z+Math.sin(k)*0.35); f.scale.set(0.45,0.05,0.14); f.rotation.y=-k; } }); }
  D.userData.ppl=ppl; return D;
}
function thumbScene(){ const sc=new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xffffff,0x8899aa,0.8)); const d=new THREE.DirectionalLight(0xffffff,0.7); d.position.set(4,9,6); d.castShadow=true; d.shadow.mapSize.set(1024,1024); Object.assign(d.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:1,far:30}); sc.add(d); return sc; }
function buildShopThumbs(){ try{
  const W=340,H=276; const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true}); r.setSize(W,H); r.setPixelRatio(1); r.shadowMap.enabled=true; r.setClearColor(0,0);
  const c=new THREE.OrthographicCamera(-3.3,3.3,2.68,-2.68,0.1,50); c.position.set(6,6.2,7.4); c.lookAt(0,0.35,0);
  for(let i=0;i<STAGES.length;i++){ const sc=thumbScene(); const D=diorama(i,false); sc.add(D); r.render(sc,c); SHOPIMG[i]=r.domElement.toDataURL('image/png'); D.traverse(o=>{ if(o.geometry&&!o.isSkinnedMesh&&o.geometry.dispose&&!Object.values(geoC).includes(o.geometry)) {} }); }
  r.dispose(); if(r.forceContextLoss) r.forceContextLoss(); }catch(e){ console.warn('thumb',e); } }
let splash=null;
function showSplash(){ const el=$('splash'); if(!el) return; el.classList.add('on'); try{
  const cv=$('spc'); const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true}); r.setPixelRatio(Math.min(devicePixelRatio||1,2)); r.shadowMap.enabled=true; r.setClearColor(0,0);
  const sc=thumbScene(); const D=diorama(0,true); sc.add(D); const c=new THREE.OrthographicCamera(-3.3,3.3,2.7,-2.7,0.1,50);
  const fit=()=>{ const w=cv.clientWidth||innerWidth, h=cv.clientHeight||innerHeight*0.5; r.setSize(w,h,false); const a=w/h, vh=Math.max(6.4,7.2/a); c.left=-vh*a/2; c.right=vh*a/2; c.top=vh/2; c.bottom=-vh/2; c.updateProjectionMatrix(); }; fit();
  const spParts=[]; let chefJ=0, coins=0; const CG=new THREE.CylinderGeometry(0.12,0.12,0.04,14), CM=()=>new THREE.MeshLambertMaterial({color:'#ffcf3a',emissive:'#7a5000',transparent:true});
  function spCoin(x,y,z,n){ for(let k=0;k<n;k++){ const m=new THREE.Mesh(CG,CM()); m.rotation.x=Math.PI/2; m.position.set(x,y,z); D.add(m); spParts.push({m,v:new THREE.Vector3((Math.random()-0.5)*2.4,3+Math.random()*2,(Math.random()-0.5)*2.4),t:0}); } coins+=n*10; $('spCoin').textContent=coins.toLocaleString(); const cc=document.querySelector('.scoin'); cc.classList.remove('bump'); void cc.offsetWidth; cc.classList.add('bump'); if(audio&&sfx&&sfx.cash) sfx.cash(); }
  let t0=performance.now(), alive=true; const loop=()=>{ if(!alive) return; const now2=performance.now(), dt=Math.min(0.05,(now2-t0)/1000); t0=now2; const a=now2/1000;
    D.rotation.y=Math.sin(a*0.35)*0.35; D.position.y=Math.sin(a*1.2)*0.05; c.position.set(7*Math.cos(0.75),6.4,7*Math.sin(0.75)+2); c.lookAt(0,0.6,0);
    const P=D.userData.ppl; P.forEach(ch=>ch.mixer.update(dt));
    // customers walk in -> pay -> walk out
    [P[1],P[2]].forEach((ch,k)=>{ const st=ch.st||(ch.st={ph:k*2.2,mode:'in'}); st.ph+=dt; const tx=st.mode==='in'?0.6+k*0.55:2.6, tz=st.mode==='in'?1.3:1.9;
      if(st.mode==='in'||st.mode==='out'){ const dx=tx-ch.g.position.x, dz=tz-ch.g.position.z, L=Math.hypot(dx,dz); if(L>0.05){ ch.g.position.x+=dx/L*dt*0.9; ch.g.position.z+=dz/L*dt*0.9; ch.g.rotation.y=Math.atan2(dx,dz); if(ch.cur!=='Walk') playA(ch,'Walk',0.15); } else if(st.mode==='in'){ st.mode='wait'; st.t=1.1; ch.g.rotation.y=Math.PI; playA(ch,'Idle',0.15); } else { ch.g.position.set(-2.2,0.06,1.6+k*0.1); st.mode='in'; } }
      else if(st.mode==='wait'){ st.t-=dt; if(st.t<=0){ st.mode='out'; spCoin(ch.g.position.x,1.6,ch.g.position.z,3); if(ch.acts.Victory){ playA(ch,'Victory',0.1); } } } });
    if(P[3]){ const w=P[3], ws=w.st||(w.st={dir:1}); w.g.position.x+=ws.dir*dt*0.8; if(w.g.position.x>0.4) ws.dir=-1; if(w.g.position.x<-1.4) ws.dir=1; w.g.rotation.y=ws.dir>0?Math.PI/2:-Math.PI/2; }
    for(let k=spParts.length-1;k>=0;k--){ const q=spParts[k]; q.t+=dt; q.v.y-=6*dt; q.m.position.addScaledVector(q.v,dt); q.m.rotation.y+=dt*8; q.m.material.opacity=Math.max(0,1-q.t*0.8); if(q.t>1.3){ D.remove(q.m); spParts.splice(k,1); } }
    if(chefJ>0){ chefJ=Math.max(0,chefJ-dt*2.5); P[0].g.position.y=0.06+Math.sin((1-chefJ)*Math.PI)*0.35; }
    r.render(sc,c); requestAnimationFrame(loop); }; loop();
  // tap toy
  cv.addEventListener('pointerdown',e=>{ e.stopPropagation(); initAudio(); chefJ=1; spCoin(0,1.6,0.3,8); });
  splash={stop:()=>{ alive=false; setTimeout(()=>{ r.dispose(); if(r.forceContextLoss) r.forceContextLoss(); },400); }}; addEventListener('resize',fit);
 }catch(e){ console.warn('splash',e); }
 const go=()=>{ el.classList.add('out'); initAudio(); sfx.pick(); if(splash) splash.stop(); setTimeout(()=>el.remove(),450); };
 $('spPlay').addEventListener('click',e=>{ e.stopPropagation(); go(); },{once:true}); }
buildShopThumbs();
if(titleOn&&!sessionStorage.getItem('bunsik-splashed')){ try{ sessionStorage.setItem('bunsik-splashed','1'); }catch(e){} showSplash(); } else { const el=$('splash'); if(el) el.remove(); }
if(titleOn){ document.body.classList.add('titling'); setTitleScene(true); updateTitle(); requestAnimationFrame(layoutBulbs); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layoutBulbs); setTimeout(layoutBulbs,600); } else startGame();
requestAnimationFrame(step);
})();
