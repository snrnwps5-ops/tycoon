    S.inv=sn.inv?Object.assign({},sn.inv):{p:10,l:6,w:8,b:6,s:6,c:6};

    S.shelf=sn.shelf?Object.assign({},sn.shelf):{};

    S.inv={p:16,l:10,w:12,b:8,s:8,c:8};
    S.unl=['repair','support','table2','decor','flag'];

/* ---------- v2.7: 손님·직원 길찾기 (A* 격자 + 벽 미끄러짐) ---------- */
const PATH={cs:0.3,x0:-14.4,z0:-9.2,w:96,h:72,pad:0.24,g:null,sig:'',n:0};
function pathSig(){ let h=OB.length*7; for(let i=0;i<OB.length;i++) h=(h*31+(OB[i].off?1:0))|0; return OB.length+':'+h; }

  for(let j=0;j<H;j++){ const z=PATH.z0+(j+0.5)*cs; for(let i=0;i<W;i++){ const x=PATH.x0+(i+0.5)*cs; let b=0;
    for(let k=0;k<OB.length;k++){ const o=OB[k]; if(o.off) continue; if(x>o.x1-pad&&x<o.x2+pad&&z>o.z1-pad&&z<o.z2+pad){ b=1; break; } }
    g[j*W+i]=b; } }

function pathFree(x,z,pad){ pad=pad==null?PATH.pad:pad;
  for(let k=0;k<OB.length;k++){ const o=OB[k]; if(o.off) continue; if(x>o.x1-pad&&x<o.x2+pad&&z>o.z1-pad&&z<o.z2+pad) return false; }

  for(let k=1;k<n;k++){ const t=k/n; if(!pathFree(x1+(x2-x1)*t,z1+(z2-z1)*t,pad)) return false; } return true; }
function pathCell(x,z){ return [Math.max(0,Math.min(PATH.w-1,Math.floor((x-PATH.x0)/PATH.cs))),Math.max(0,Math.min(PATH.h-1,Math.floor((z-PATH.z0)/PATH.cs)))]; }

function pathNear(i,j){ const g=PATH.g, W=PATH.w, H=PATH.h; if(!g[j*W+i]) return [i,j];

    for(let dj=-r;dj<=r;dj++) for(let di=-r;di<=r;di++){ if(Math.max(Math.abs(di),Math.abs(dj))!==r) continue;
      const a=i+di,b=j+dj; if(a<0||b<0||a>=W||b>=H) continue; if(g[b*W+a]) continue; const d=di*di+dj*dj; if(d<bd){ bd=d; best=[a,b]; } }

/* v2.8: 손님에게 다가갈 때 테이블 안쪽 좌표(z-0.9 등)를 목표로 잡아 가구에 끼이던 문제 —
   손님 주변의 '빈 칸'을 목표로 삼고, 손님과 1.25m 안이면 도착으로 본다 */
function custSpot(o,c,r){ r=r||0.82;
  let bx=o.pos.x-c.pos.x, bz=o.pos.z-c.pos.z, L=Math.hypot(bx,bz); if(L<1e-3){ bx=0; bz=1; L=1; }

    let best=null, bd=1e9;

/* 장애물에 파고들었을 때 밀어내기 (손님·직원 공용 충돌 반경) */
function stepActor(o,dx,dz,R){
  if(dx){ o.pos.x+=dx; const b=collideBox(o.pos.x,o.pos.z,R); if(b) o.pos.x=dx>0?b.x1-R:b.x2+R; }
  if(dz){ o.pos.z+=dz; const b=collideBox(o.pos.x,o.pos.z,R); if(b) o.pos.z=dz>0?b.z1-R:b.z2+R; }

function collideBox(px, pz, R){
  for(const b of OB){
    if(b.off) continue;
    if(px>b.x1-R&&px<b.x2+R&&pz>b.z1-R&&pz<b.z2+R) return b;
  }
  return null;
}
function collideAxis(p, axis, oldVal){
  const R=0.28;
  const b=collideBox(p.x, p.z, R);
  if(b){
    /* v2.15: 부드러운 벽 슬라이딩 & 모서리 끼임 락 영구 박멸.
       이전 위치(oldVal)가 충돌 박스 어느 쪽에 있었는지 판정해, 진행 방향 벽 표면으로만 붙이고
       반대 방향으로 빠져나올 때는 절대 가두지 않는다. */
    if(axis==='x'){

      else if(oldVal>=b.x2+R-0.02) p.x=b.x2+R;
      else {
        const dx=p.x-oldVal;
        if(dx>0) p.x=b.x1-R;
        else if(dx<0) p.x=b.x2+R;
        else p.x=(p.x-(b.x1-R)<(b.x2+R)-p.x)?b.x1-R:b.x2+R;
      }

    if(revR>=1.3) rs.push('매출 '+Math.round(revR*100)+'%');
    if(rt>=4.3) rs.push('평점 '+rt.toFixed(1));
    if(comp===0) rs.push('민원 0');
    try{
      var b=V262.bd||{}, bv=Math.min(goal*0.10,(b.rev||0)*0.04);
      if(bv>0){ val+=bv; rs.push('법인 계약 '+((b.won||0)||1)+'건'); }
    }catch(e){}
    var sh=Math.max(0.1,Math.round(val/(p1/10)*10)/10);

    R.grant=sh; R.grantVal=Math.round(sh*(p1/10)); R.reasons=rs;

    }
    o.vt=0;
  }

function v266ShopTag(x){
  if(x.tag) return x.tag;

}
function v266ShopPaint(){
  try{
    var mb=$('mbox'); if(!mb) return;
    var list=mb.querySelector('.shl'); if(!list) return;
    var ad=list.querySelector('.shi.ad');
    var items=SHOP.filter(function(x){ try{ return !!x.show(); }catch(e){ return false; } });
    if(!items.length) return;
    var hero=items.filter(function(x){ return x.id==='vip'; })[0]||items.filter(function(x){ return x.old; })[0]||items.filter(function(x){ return x.hot; })[0]||null;
    var rest=items.filter(function(x){ return x!==hero; });
    function row(x){
      var btn='<button data-buy="'+x.id+'">'+(x.old?'<s>'+x.old+'</s>':'')+x.p+'</button>';
      return '<div class="shi'+(x.hot?' hot':'')+'">'+(x.tag?'<em>'+hesc(x.tag)+'</em>':'')+spI(x.sp,42)+
        '<div><b>'+hesc(x.n)+'</b><small>'+hesc(x.d)+'</small></div>'+btn+'</div>';
    }
    function sec(title,sub){ return '<div class="vShopSec"><b>'+title+'</b><small>'+sub+'</small></div>'; }
    var h='';
    if(hero){
      var perks=String(hero.d||'').split('·').map(function(s){ return s.trim(); }).filter(Boolean).slice(0,4);
      h+='<div class="vHero"><div class="vKick">'+(hero.id==='vip'?'BEST VALUE':'LIMITED OFFER')+'</div>'+
        '<h3>'+hesc(hero.n)+'</h3><p>'+hesc(perks.join('  ·  '))+'</p>'+
        '<div class="vPerks">'+perks.map(function(p){ return '<span>'+hesc(p)+'</span>'; }).join('')+'</div>'+
        '<div class="vHeroRow">'+(hero.old?'<s>'+hero.old+'</s>':'')+'<b>'+hero.p+'</b><small style="margin-left:auto;color:#93a0b8;font:700 10px var(--b)">테스트 결제</small></div>'+
        '<button data-buy="'+hero.id+'" style="margin-top:11px">'+(hero.id==='vip'?'VIP 패스 구매하기':'구매하기')+'</button></div>';
    }
    var boost=rest.filter(function(x){ return x.id==='boost'; });
    var cash=rest.filter(function(x){ return /^cash/.test(x.id); });
    var perm=rest.filter(function(x){ return x.id!=='boost'&&!/^cash/.test(x.id); });
    if(boost.length) h+=sec('이번 영업','바로 적용되는 부스터')+boost.map(row).join('');
    if(cash.length) h+=sec('자금 충전','즉시 지급')+cash.map(row).join('');
    if(perm.length) h+=sec('패스 · 영구 혜택','한 번 사면 계속')+perm.map(row).join('');
    if(ad){ ad.querySelector('button'); h+='<div class="vShopSec"><b>무료</b><small>하루 3번까지</small></div>'; }
    list.innerHTML=h;
    if(ad){ try{ ad.className='shi ad'; list.appendChild(ad); }catch(e){} }
    var note=mb.querySelector('.vFootNote');
    if(!note){ var n=document.createElement('div'); n.className='vFootNote'; n.textContent='테스트 결제입니다 · 실제 돈이 나가지 않아요'; if(ad&&ad.parentNode) ad.parentNode.appendChild(n); }
  }catch(e){ try{ console.warn('v266ShopPaint',e); }catch(_){} }
}

/* ---------------- 3) ★3 연속 사슬 (3일 연속 → 보장 상자) ---------------- */
function v269ChainStep(clear,stars,cfg){
  var C=S.c3, R={n:C.n|0,p:0,star3:0,bonus:0,pay:0,boost:0,newDay:0};
  try{
    if(C.day===S.day){ /* 같은 날 재도전: 기록만 갱신하고 보상은 두 번 주지 않는다 */
      if(clear&&stars>(C.st|0)) C.st=stars;
      R.p=v269ChainP(); return R;
    }
    C.day=S.day; C.st=clear?(stars|0):0; R.newDay=1;
    if(clear&&stars>=3){ C.n=(C.n|0)+1; C.tot=(C.tot|0)+1; if(C.n>(C.best|0)) C.best=C.n; R.star3=1; }
    else C.n=0;
    R.n=C.n|0; R.p=v269ChainP();
    if(R.star3&&C.n>0&&C.n%3===0&&C.bd!==S.day){
      C.bd=S.day; R.bonus=1;
      R.pay=Math.max(20,Math.round((cfg&&cfg.goal?cfg.goal:100)*0.35/10)*10);
      money+=R.pay;
      try{ S.boostD=S.day+1; R.boost=1; }catch(e){}
      setTimeout(function(){ try{ bigBanner('🔥 ★3 3연속!','보장 상자 +$'+R.pay+' · 다음 영업 매출 2배'); confetti(player.pos.x,2.5,player.pos.z); snd('level_up',0.6); haptic([10,40,10]); }catch(e){} },700);
    }
  }catch(e){}
  return R;
}

function truckTick(dt){
  if(!TRUCK.jobs.length) return;
  for(let i=TRUCK.jobs.length-1;i>=0;i--){ const j=TRUCK.jobs[i];
    if(j.delay>0){ j.delay-=dt; if(j.delay>0) continue; }
    j.tt+=dt;
    if(j.ph==='wait'){ j.ph='in'; j.tt=0; }
    if(j.ph==='in'){ const d=j.quick?0.7:1.4, u=Math.min(1,j.tt/d), e=u*u*(3-2*u), x0=j.quick?TRKD.quickX:TRKD.inX, x1=j.quick?TRKD.quickStop:TRKD.stop;
