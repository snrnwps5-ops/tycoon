function _jong(w){ var s=String(w==null?'':w).replace(/\s+$/,''); if(!s) return -1; var c=s.charCodeAt(s.length-1); return (c>=0xAC00&&c<=0xD7A3)?((c-0xAC00)%28):-1; }
function josaEul(w){ return String(w)+(_jong(w)>0?'을':'를'); }              /* 을 / 를 */
function josaGa(w){ return String(w)+(_jong(w)>0?'이':'가'); }               /* 이 / 가 */

/* ---------- v2.7: 손님·직원 길찾기 (A* 격자 + 벽 미끄러짐) ---------- */
const PATH={cs:0.3,x0:-14.4,z0:-9.2,w:96,h:72,pad:0.24,g:null,sig:'',n:0};
function pathSig(){ let h=OB.length*7; for(let i=0;i<OB.length;i++) h=(h*31+(OB[i].off?1:0))|0; return OB.length+':'+h; }

  for(let j=0;j<H;j++){ const z=PATH.z0+(j+0.5)*cs; for(let i=0;i<W;i++){ const x=PATH.x0+(i+0.5)*cs; let b=0;

  for(let k=0;k<OB.length;k++){ const o=OB[k]; if(o.off) continue; if(x>o.x1-pad&&x<o.x2+pad&&z>o.z1-pad&&z<o.z2+pad) return false; }

function pathCell(x,z){ return [Math.max(0,Math.min(PATH.w-1,Math.floor((x-PATH.x0)/PATH.cs))),Math.max(0,Math.min(PATH.h-1,Math.floor((z-PATH.z0)/PATH.cs)))]; }

    for(let dj=-r;dj<=r;dj++) for(let di=-r;di<=r;di++){ if(Math.max(Math.abs(di),Math.abs(dj))!==r) continue;

/* v2.8: 손님에게 다가갈 때 테이블 안쪽 좌표(z-0.9 등)를 목표로 잡아 가구에 끼이던 문제 —
   손님 주변의 '빈 칸'을 목표로 삼고, 손님과 1.25m 안이면 도착으로 본다 */
function custSpot(o,c,r){ r=r||0.82;
  let bx=o.pos.x-c.pos.x, bz=o.pos.z-c.pos.z, L=Math.hypot(bx,bz); if(L<1e-3){ bx=0; bz=1; L=1; }

    if(cur===goal){

      const ng=gs[cur]+((d&&e)?1.4142:1); if(ng<gs[nk]){ gs[nk]=ng; came[nk]=cur; push(nk,ng+Math.hypot(ni-gi,nj-gj)); } }

  return null; }
/* 장애물에 파고들었을 때 밀어내기 (손님·직원 공용 충돌 반경) */
function stepActor(o,dx,dz,R){
  if(dx){ o.pos.x+=dx; const b=collideBox(o.pos.x,o.pos.z,R); if(b) o.pos.x=dx>0?b.x1-R:b.x2+R; }
  if(dz){ o.pos.z+=dz; const b=collideBox(o.pos.x,o.pos.z,R); if(b) o.pos.z=dz>0?b.z1-R:b.z2+R; }

}
function collideBox(px, pz, R){
  for(const b of OB){
    if(b.off) continue;
    if(px>b.x1-R&&px<b.x2+R&&pz>b.z1-R&&pz<b.z2+R) return b;
  }
  return null;
}
function collideAxis(p, axis, oldVal){
  const R=0.28;
  const b=collideBox(p.x, p.z, R);
  if(b){
    /* v2.15: 부드러운 벽 슬라이딩 & 모서리 끼임 락 영구 박멸.
       이전 위치(oldVal)가 충돌 박스 어느 쪽에 있었는지 판정해, 진행 방향 벽 표면으로만 붙이고
       반대 방향으로 빠져나올 때는 절대 가두지 않는다. */
    if(axis==='x'){
      if(oldVal<=b.x1-R+0.02) p.x=b.x1-R;
      else if(oldVal>=b.x2+R-0.02) p.x=b.x2+R;
      else {
        const dx=p.x-oldVal;
        if(dx>0) p.x=b.x1-R;
        else if(dx<0) p.x=b.x2+R;
        else p.x=(p.x-(b.x1-R)<(b.x2+R)-p.x)?b.x1-R:b.x2+R;
      }
    } else {
      if(oldVal<=b.z1-R+0.02) p.z=b.z1-R;
      else if(oldVal>=b.z2+R-0.02) p.z=b.z2+R;
      else {
        const dz=p.z-oldVal;
        if(dz>0) p.z=b.z1-R;
        else if(dz<0) p.z=b.z2+R;
        else p.z=(p.z-(b.z1-R)<(b.z2+R)-p.z)?b.z1-R:b.z2+R;
      }
    }
  }

  p.z=Math.max(-7.8,Math.min(5.6,p.z));

function collide(p){

function comboHit(){ combo++; comboT=14; if(combo%5===0&&dayComp>0&&dayComp<3){ dayComp=Math.max(0,dayComp-0.5); floatText(player.pos.clone().setY(3.0),'👍 민원 -0.5 만회!','say'); } if(combo===2&&!S.tipCombo){ S.tipCombo=1; toast('⚡ 연속으로 응대하면 콤보! 매출이 올라가요 (8콤보 = 피버)',4); } S.stats.combo=Math.max(S.stats.combo||0,combo); const el=$('combo'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  if(combo%8===0&&feverT<=0){ feverT=12; S.stats.fever=(S.stats.fever||0)+1; bigBanner('🔥 FEVER!','12초 동안 매출 1.4배 · 이동 속도 UP'); sfxFever(); haptic([12,40,12]); $('vig').classList.add('fv'); } }
function comboBreak(){ if(combo>=3) floatText(player.pos.clone().setY(2.6),'콤보 끊김…','bad'); combo=0; comboT=0; }
function comboMul(){ return (1+Math.min(combo,10)*0.03)*(feverT>0?1.4:1); }
function comboTick(dt){ if(feverT>0){ feverT-=dt; if(feverT<=0) $('vig').classList.remove('fv'); } if(dayState==='run'){ if(combo>0){ comboT-=dt; if(comboT<=0) combo=0; } } else if(combo||feverT>0){ combo=0; feverT=0; $('vig').classList.remove('fv'); }
  const el=$('combo'); if(combo>=2||feverT>0){ el.style.display='block'; el.querySelector('b').textContent=feverT>0?'🔥 FEVER':'COMBO ×'+combo; el.querySelector('small').textContent='매출 +'+Math.round((comboMul()-1)*100)+'%'; el.querySelector('s').style.width=Math.max(0,(feverT>0?feverT/12:comboT/14)*100)+'%'; el.classList.toggle('fv',feverT>0); } else el.style.display='none'; }
