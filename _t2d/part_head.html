   저장소를 쓸 수 없는 환경(사생활 보호 모드)에서는 아무것도 지우지 않는다. */
try{(function(){
  var EP='v272', K='tech-epoch', P=/^(bunsik-|tech-)/;
  function wipe(){
    var del=[];
    try{ for(var i=0;i<localStorage.length;i++){ var n=localStorage.key(i); if(n&&n!==K&&P.test(n)) del.push(n); } }catch(e){ return 0; }
    for(var j=0;j<del.length;j++){ try{ localStorage.removeItem(del[j]); }catch(e){} }
    try{ sessionStorage.removeItem('tech-skip'); }catch(e){}
    return del.length;
  }
  /* 설정의 [초기화] 버튼과 QA가 함께 쓰는 공개 함수 */
  window.__v272Wipe=function(reload){ var n=0; try{ n=wipe(); }catch(e){} try{ localStorage.setItem(K,EP); }catch(e){}
    if(reload){ try{ location.reload(); }catch(e){} }
    return n; };
  var cur=null; try{ cur=localStorage.getItem(K); }catch(e){ cur=EP; }   /* 저장소를 못 쓰면 그냥 넘어간다 */
  if(cur===EP) return;
  var removed=0; try{ removed=wipe(); }catch(e){}
  try{ localStorage.setItem(K,EP); }catch(e){}
  try{ window.__v272Reset={ver:EP,removed:removed}; }catch(e){}
})();}catch(e){}</script>
